name: "octalweb-links-staging"

# Common defaults for services.
# Reused via "<<: *defaults" to avoid duplication.
x-defaults: &defaults
  restart: "no"
  init: true
  stop_grace_period: "5s"
  env_file:
    - "../.env"
  networks:
    - "octalnet-links-staging"

services:
  # ========================================================================== #
  #                                Applications                                #
  # ========================================================================== #

  owl-app-web:
    <<: *defaults
    container_name: "owl-app-web"
    image: "octalmesh/owl-app-web"
    build:
      context: "../../.."
      dockerfile: "infra/staging/docker/Dockerfile"
    ports:
      - "${LINKS_WEB_PORT:-5174}:${LINKS_WEB_PORT:-5174}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${LINKS_WEB_PORT:-5174}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

# Dedicated isolated networks
networks:
  octalnet-links-staging:
    name: "octalnet-links-staging"
