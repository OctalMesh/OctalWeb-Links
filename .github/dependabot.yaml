# ============================================================================ #
#                        Dependabot Configuration File                         #
# ============================================================================ #
# This file defines the Dependabot configuration for this project. It keeps    #
# pnpm dependencies, Go (CLI) dependencies, and GitHub Actions up to date by   #
# opening pull requests on a weekly schedule, grouped by ecosystem.            #
#                                                                              #
# See: https://dependabot.com                                                  #
# ============================================================================ #

version: 2

updates:
  # Keep npm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 5

    # Runs every Monday
    schedule:
      interval: "weekly"
      day: "monday"

    reviewers:
      - "OctalMesh/development"

    labels:
      - "Dependencies"

    groups:
      # TypeScript ecosystem packages
      typescript:
        patterns:
          - "typescript"
          - "typescript-*"

      # React ecosystem packages
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # Astro ecosystem packages
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"

      # Tailwind CSS ecosystem packages
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-*"
          - "tw-*"

      # ESLint ecosystem packages
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"

      # Prettier ecosystem packages
      prettier:
        patterns:
          - "prettier"
          - "prettier-*"
          - "@trivago/prettier-*"

      # Testing-related packages
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vite-*"
          - "@vitejs/*"
          - "@testing-library/*"
          - "jsdom"

      # TypeScript types packages
      types:
        patterns:
          - "@types/node"
          - "@types/estree"

    # Ignore major version updates for critical dependencies to prevent breaking
    # changes without manual review
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      - dependency-name: "react"
        update-types: [ "version-update:semver-major" ]

      - dependency-name: "react-dom"
        update-types: [ "version-update:semver-major" ]

      - dependency-name: "astro"
        update-types: [ "version-update:semver-major" ]

  # Keep Go (CLI) dependencies up to date
  - package-ecosystem: "gomod"
    directory: "/cli"
    target-branch: "dev"
    open-pull-requests-limit: 5

    # Runs every Monday
    schedule:
      interval: "weekly"
      day: "monday"

    reviewers:
      - "OctalMesh/development"

    labels:
      - "Dependencies"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 5

    # Runs every Monday
    schedule:
      interval: "weekly"
      day: "monday"

    reviewers:
      - "OctalMesh/development"

    labels:
      - "Dependencies"

    groups:
      # GitHub Actions ecosystem packages
      github-actions:
        patterns:
          - "*"
