name: "CodeQL Configuration (JS/TS)"

paths-ignore:
  # Dependencies & build output

  - "node_modules/**"
  - "dist/**"
  - ".astro/**"
  - "coverage/**"

  # Static assets

  - "public/**"

  # Config & tooling

  - "*.config.*"
  - "*.config.ts"
  - "*.config.js"
  - "*.config.mjs"

  # Test files

  - "**/testdata/**"
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "**/*.test.{ts,tsx,js,jsx}"
  - "**/*.spec.{ts,tsx,js,jsx}"

queries:
  - uses: "security-and-quality"

query-filters:
  - exclude:
      tags contain: "correctness/unused-variable"
