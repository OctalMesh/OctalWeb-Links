# ============================================================================ #
#                               Go Test Workflow                               #
# ============================================================================ #
# Runs Go tests on every push to dev and on every pull request targeting dev   #
# that includes changes to the CLI source code.                                #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]      - skips all workflows                                       #
#   [test-skip]    - skips all test workflows                                  #
#   [go-test-skip] - skips this workflow only                                  #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "CLI: Test"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "cli/**"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: belay
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[test-skip],[go-test-skip]"

  # Perform Go tests
  test:
    name: "Go Test (${{ matrix.os }})"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum

      - name: "Setup: Download dependencies"
        working-directory: cli
        run: |
          go mod download
          go mod verify

      - name: "Setup: Build"
        working-directory: cli
        run: go build -v ./...

      - name: "Run: Run tests"
        working-directory: cli
        shell: bash
        run: go test -v -coverprofile=coverage-${{ matrix.os }}.out ./...

      - name: "Run: Upload coverage"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: cli/coverage-${{ matrix.os }}.out
          retention-days: 7
