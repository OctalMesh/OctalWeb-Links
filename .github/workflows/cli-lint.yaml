name: "CLI: Lint"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "cli/**"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - id: skip_check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [[ "$COMMIT_MSG" == *"[ci-skip]"* ]] || \
             [[ "$COMMIT_MSG" == *"[lint-skip]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  # Perform golangci-lint analysis
  lint:
    name: "GolangCI Lint"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum

      - name: "Run golangci-lint"
        working-directory: cli
        run: go tool golangci-lint run ./...
