# ============================================================================ #
#                               Go Lint Workflow                               #
# ============================================================================ #
# Runs golangci-lint analysis on every push to dev and on every pull request   #
# targeting dev that includes changes to the CLI source code.                  #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]   - skips all workflows                                          #
#   [lint-skip] - skips this workflow only                                     #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "CLI: Lint"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "cli/**"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: belay
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[lint-skip]"

  # Perform golangci-lint analysis
  lint:
    name: "GolangCI Lint"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum

      - name: "Run: GolangCI Lint"
        working-directory: cli
        run: go tool golangci-lint run ./...
