name: "Test CLI"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "cli/**"
  pull_request:
    branches: ["dev"]
    paths:
      - "cli/**"

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - id: skip_check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [[ "$COMMIT_MSG" == *"[ci-skip]"* ]] || \
             [[ "$COMMIT_MSG" == *"[test-skip]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  # Perform Go tests
  test:
    name: "Go Test (${{ matrix.os }})"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Set up Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache: true

      - name: "Download dependencies"
        working-directory: cli
        run: |
          go mod download
          go mod verify

      - name: "Build"
        working-directory: cli
        run: go build -v ./...

      - name: "Run tests"
        working-directory: cli
        shell: bash
        run: go test -v -coverprofile=coverage-${{ matrix.os }}.out ./...

      - name: "Upload coverage"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: cli/coverage-${{ matrix.os }}.out
          retention-days: 7
